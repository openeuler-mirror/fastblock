syntax = "proto3";
option cc_generic_services = true;
package osd;
import "common_msg.proto";

message write_request
{
    uint64 pool_id = 1;
    uint64 pg_id = 2;
    bytes object_name = 3;
    uint64 offset = 4;
    bytes data = 5;
    // AOS image timeline (0 = unset / head-only path). Design P5.
    uint64 image_snap_seq = 6;
    // Bulk payload length when data is sent out-of-band (not in bytes data).
    uint32 data_len = 7;
}

message write_reply
{
    int32 state = 1;
}

message read_request
{
    uint64 pool_id = 1;
    uint64 pg_id = 2;
    bytes object_name = 3;
    uint64 offset = 4;
    uint64 length = 5;
    // Optional AOS snapshot view (0 = head). Design P5.
    uint64 image_read_seq = 6;
    uint64 raft_read_index = 7;
}

message read_reply
{
    int32 state = 1;
    bytes data = 2;
    uint32 data_len = 3;
}

message delete_request
{
    uint64 pool_id = 1;
    uint64 pg_id = 2;
    bytes object_name = 3;
}

message delete_reply
{
    int32 state = 1;
    bytes  str = 2;
}

message write_cmd
{
    bytes object_name = 1;
    uint64 offset = 2;
    uint64 image_snap_seq = 3; // AOS image timeline (0 = unset)
}

message read_cmd
{
    bytes object_name = 1;
    uint64 offset = 2;
    uint64 length = 3;
}

message delete_cmd
{
    bytes object_name = 1;
    uint64 image_snap_seq = 2;
}

message bench_request
{
    bytes req = 1;
}

message bench_response
{
    bytes resp = 1;
}

message pg_leader_request
{
    uint64 pool_id = 1;
    uint64 pg_id = 2;
}

message pg_leader_response
{
    int32 state = 1;
    int32 leader_id = 2;
    bytes leader_addr = 3;
    int32 leader_port = 4;
}

message create_pg_request
{
    uint64 pool_id = 1;
    uint64 pg_id = 2;
    int64  vision_id = 3;
    uint32 coreindex = 4;
    repeated raft_node_info nodes = 5;
}

message create_pg_response
{
    int32 state = 1;
}

message add_node_request {
    uint64 pool_id = 1;
    uint64 pg_id = 2;
    raft_node_info node = 3;
}

message add_node_response {
    int32 state = 1;
    repeated int32 new_nodes = 2;
}

message remove_node_request {
    uint64 pool_id = 1;
    uint64 pg_id = 2;
    raft_node_info node = 3;
}

message remove_node_response {
    int32 state = 1;
    repeated int32 new_nodes = 2;
}

message change_nodes_request {
    uint64 pool_id = 1;
    uint64 pg_id = 2;
    repeated raft_node_info new_nodes = 3;
}

message change_nodes_response {
    int32 state = 1;
    repeated int32 new_nodes = 2;
}

// --- AOS image snapshot / clone / flatten (design P5) ---

enum image_snap_op {
    IMAGE_SNAP_CREATE = 0;   // pin image_snap_seq
    IMAGE_SNAP_CLONE = 1;    // re-pin (clone reader)
    IMAGE_SNAP_RELEASE = 2;  // unpin
    IMAGE_SNAP_FLATTEN = 3;  // materialize parent -> new_seq
}

message image_snap_request {
    uint64 pool_id = 1;
    uint64 pg_id = 2;
    image_snap_op op = 3;
    // CREATE/CLONE/RELEASE: the snap seq to pin/unpin.
    // FLATTEN: parent_image_seq.
    uint64 image_snap_seq = 4;
    // FLATTEN only: destination image seq (must be > parent).
    uint64 new_image_seq = 5;
    // FLATTEN only: base raft index for rewritten extents.
    uint64 raft_write_index = 6;
}

message image_snap_reply {
    int32 state = 1;
}

service rpc_service_osd{
    rpc process_write(write_request) returns (write_reply);
    rpc process_read(read_request) returns (read_reply);
    rpc process_delete(delete_request) returns (delete_reply);
    rpc process_rpc_bench(bench_request) returns (bench_response);
    rpc process_get_leader(pg_leader_request) returns (pg_leader_response);
    rpc process_create_pg(create_pg_request) returns (create_pg_response);
    rpc process_add_node(add_node_request) returns (add_node_response);
    rpc process_remove_node(remove_node_request) returns (remove_node_response);
    rpc process_change_nodes(change_nodes_request) returns (change_nodes_response);
    rpc process_image_snap(image_snap_request) returns (image_snap_reply);
}
