syntax = "proto3";
//option go_package = "./";

package msg;

message CreatePoolRequest{
    string name = 1;
    int32 pgsize = 2;
    int32 pgcount = 3;
    string failuredomain = 4;
    string root = 5;
}


enum CreatePoolErrorCode
{
    createPoolOk = 0;
    poolNameExists = 1;
    failureDomainNeedNotSatisfied = 2;
    noEnoughOsd = 3;
    internalError = 4;
}

message CreatePoolResponse{
    CreatePoolErrorCode errorcode = 1;
    int32 poolid = 2;
}


message ListPoolsRequest{
}

message poolinfo{
    int32 poolid = 1;
    string name = 2;
    int32 pgsize = 3;
    int32 pgcount = 4;
    string failuredomain = 5;
    string root = 6;
}

message ListPoolsResponse{
    repeated poolinfo pi = 1;
}


message DeletePoolRequest{
    string name = 1;
}

message DeletePoolResponse{
    bool ok = 1;
}

message ApplyIDRequest{
    string uuid = 1;
}

enum ApplyIDErrorCode
{
    ApplyIdOk = 0;
    UuidAlreadyExists = 1;
    InvalidUUid = 2;
    InternalError = 3;
}

message ApplyIDResponse{
    string uuid = 1;
    int32 id = 2;
    ApplyIDErrorCode errorcode = 3;
}

message ShardCore{
    uint32 coreid = 1;
    uint32 port = 2;
}

message BootRequest {
    int32 osd_id = 1;
    string uuid = 2;
    int64 size = 3;
    map<uint32, ShardCore> sharded_ports = 4;
    string address = 5;
    string host = 6;
    uint32 core_num = 7;
    string config = 8;
}

message PGInfo {
    int32 pgid = 1;
    int64 version = 2;
    int32 state = 3;
    uint32 coreindex = 4;
    repeated int32 osdid = 5;
    uint32 newcoreindex = 6;
    repeated int32 newosdid = 7;
}

message PGInfos {
    repeated PGInfo pi = 1;
}

enum GetPgMapErrorCode
{
    pgMapGetOk = 0;
    pgMapclientVersionHigher = 1;
    PgMapclusterNoPools = 2;
    PgMapSameVersion = 3;
}

message GetPgMapRequest{
    map<int32, int64> pool_versions = 1;
}

// when osd restarts, following infomation is changed(host may not)
message OsdDynamicInfo{
	int32 osdid = 1;
	string address =2;
    map<uint32, ShardCore> sharded_ports = 3;
	bool isin    = 4;
	bool isup     = 5;
    bool ispendingcreate = 6;
}

message GetPgMapResponse {
    map<int32, GetPgMapErrorCode> errorcode = 1;
    map<int32, int64> poolid_pgmapversion = 2;
    map<int32, PGInfos> pgs = 3;
    map<int32, string> pools = 4;
}

message GetOsdMapRequest{
    int32 osdid = 1;
    int64 currentversion = 2;
}



enum OsdMapErrorCode
{
    ok = 0;
    clientVersionHigher = 1;
    clientVersionInvalid = 2;
    noOsdsExist = 3;
}

message GetOsdMapResponse {
    OsdMapErrorCode errorcode = 1;
    int64 osdmapversion = 2;
    repeated OsdDynamicInfo osds = 3;
}

message GetClusterMapRequest{
    GetOsdMapRequest gom_request = 1;
    GetPgMapRequest  gpm_request = 2;
}

message GetClusterMapResponse {
    GetOsdMapResponse gom_response = 1;
    GetPgMapResponse  gpm_response = 2;
}


message BootResponse {
    int32 result = 1;
}

message OsdStopRequest {
    int32 id = 1;
}


message OsdStopResponse {
    bool ok = 1;
}

message HeartbeatRequest {
    int32 id = 1;
}
message HeartbeatResponse {
    bool ok = 1;
}

message ImageInfo{
    string poolname=1;
    string imagename=2;
    int64 size=3;
    int64 object_size=4;
}

message  CreateImageRequest{
    string poolname=1;
    string imagename=2;
    int64 size=3;
    int64 object_size=4;
}

enum CreateImageErrorCode
{
    createImageOk = 0;
    imageExists = 1;
    unknownPoolName = 2;
    marshalImageContextError = 3;
    putEtcdError = 4;
    imageNameTooLong = 5;
}

message  CreateImageResponse{
    CreateImageErrorCode errorcode = 1;
    ImageInfo ImageInfo = 2;
}

message  RemoveImageRequest{
     string poolname=1;
     string imagename=2;
}

enum RemoveImageErrorCode {
    removeImageOk = 0;
    imageNotFound = 1;
    removeImageFail = 2;
}

message  RemoveImageResponse{
    RemoveImageErrorCode errorcode = 1;
    ImageInfo ImageInfo=2;
}

message ResizeImageRequest{
    string poolname=1;
    string imagename=2;
    int64  size=3;
}

enum ResizeImageErrorCode {
    resizeImageOk = 0;
    resizeImageNotFound = 1;
    marshalResizeImageContextError = 2;
    putResizeImageEtcdError = 3;
}

message ResizeImageResponse{
    ResizeImageErrorCode errorcode = 1;
    ImageInfo ImageInfo=2;
}

message GetImageInfoRequest{
     string poolname=1;
     string imagename=2;
}

enum GetImageErrorCode {
    getImageOk = 0;
    getImageNotFound = 1;
}

message GetImageInfoResponse{
    GetImageErrorCode errorcode = 1;
    ImageInfo ImageInfo=2;
}

message LeaderBeElectedRequest {
    int32 leaderId = 1;
    uint64 poolId = 2;
    uint64 pgId = 3;
    repeated int32 osdList = 4;
    repeated int32 newOsdList = 5;
}

message LeaderBeElectedResponse {
    bool ok = 1;
}

message PgMemberChangeFinishRequest {
    int32  result = 1;
    uint64 poolId = 2;
    uint64 pgId = 3;
    repeated int32 osdList = 4;
}

message PgMemberChangeFinishResponse {
    bool ok = 1;
}

message OsdOutRequest {
    int32 osdid = 1;
}

message OsdOutResponse {
    bool ok = 1;
}

message OsdInRequest {
    int32 osdid = 1;
}

message OsdInResponse {
    bool ok = 1;
}

message NoReblanceRequest {
    bool set = 1;
}

message NoReblanceResponse {
    bool ok = 1;
}

message NoOutRequest {
    bool set = 1;
}

message NoOutResponse {
    bool ok = 1;
}

message ClusterStates {
    bool    noReblance = 1;
    bool    noOut      = 2;
}

message PgStateInfo {
    int32   creatingNum          = 1;
    int32   activeNum            = 2;
    int32   undersizeNum         = 3;
    int32   downNum              = 4;
    int32   remapNum             = 5;
    int32   creatingUndersizeNum = 6;
    int32   creatingDownNum      = 7;
    int32   undersizeRemapNum    = 8;
    int32   downRemapNum         = 9;
}

message GetClusterStatusRequest {
}

message GetClusterStatusResponse {
    ClusterStates  clusterState = 1;
    repeated string monName     = 2;
    int32          osdNum       = 3;
    int32          upOsdNum     = 4;
    int32          inOsdNum     = 5;
    int32          poolNum      = 6;
    int32          pgNum        = 7;
    int32          objectNum    = 8;
    PgStateInfo    pgState      = 9;
    //单位字节每秒
    uint64        cliReadBytes = 10;
    uint64        cliWriteBytes = 11;

    uint64        cliReadIops   = 12;
    uint64        cliWriteIops  = 13;

    //单位字节每秒
    uint64        recoveryBytes = 14;
    //recovery时每秒恢复多少个object
    uint64        recoveryObjPs = 15;
}

message DataStatistics {
    uint64     read_ios         = 1;
    uint64     read_bytes       = 2;
    uint64     write_ios        = 3;
    uint64     write_bytes      = 4;
    int64      objects          = 5;
    uint64     recovery_bytes   = 6;
    uint64     recovery_obs     = 7;
}

message DataStatisticsRequest {
    map<string, DataStatistics>  data = 1;
}

message DataStatisticsResponse {
    bool ok = 1;
}

message OsdConfigRequest {
    int32 osdid = 1;
}

message OsdConfigResponse {
    string config = 1;
}

message GetPgOsdInfoRequest {
    repeated int32 poolIds = 1;
}

message PgOsdInfo {
    int32 pgid = 1;
    uint32 coreindex = 2;
    repeated int32 osdid = 3;
}

message PgOsdInfos {
    repeated PgOsdInfo pgs = 1;
}

message GetPgOsdInfoResponse {
    map<int32, PgOsdInfos> pools = 1; 
}

message CSIVolumeMetadata {
    string volume_id = 1;
    string pool_name = 2;
    string image_name = 3;
    int64 capacity_bytes = 4;
    int64 object_size = 5;
    int64 block_size = 6;
    string transport = 7;
    string export_id = 8;
}

message CSIAttachment {
    string volume_id = 1;
    string node_id = 2;
    string host_nqn = 3;
    string export_id = 4;
}

enum CSIMetadataErrorCode {
    csiMetadataOk = 0;
    csiMetadataNotFound = 1;
    csiMetadataInvalidArgument = 2;
    csiMetadataInternalError = 3;
}

message PutCSIVolumeMetadataRequest {
    CSIVolumeMetadata metadata = 1;
}

message PutCSIVolumeMetadataResponse {
    CSIMetadataErrorCode errorcode = 1;
}

message GetCSIVolumeMetadataRequest {
    string volume_id = 1;
}

message GetCSIVolumeMetadataResponse {
    CSIMetadataErrorCode errorcode = 1;
    CSIVolumeMetadata metadata = 2;
}

message DeleteCSIVolumeMetadataRequest {
    string volume_id = 1;
}

message DeleteCSIVolumeMetadataResponse {
    CSIMetadataErrorCode errorcode = 1;
}

message PutCSIAttachmentRequest {
    CSIAttachment attachment = 1;
}

message PutCSIAttachmentResponse {
    CSIMetadataErrorCode errorcode = 1;
}

message GetCSIAttachmentRequest {
    string volume_id = 1;
}

message GetCSIAttachmentResponse {
    CSIMetadataErrorCode errorcode = 1;
    CSIAttachment attachment = 2;
}

message DeleteCSIAttachmentRequest {
    string volume_id = 1;
}

message DeleteCSIAttachmentResponse {
    CSIMetadataErrorCode errorcode = 1;
}

message CSIVolumeLease {
    string volume_id = 1;
    string node_id = 2;
    string host_nqn = 3;
    int64 lease_id = 4;
    int64 ttl_seconds = 5;
}

enum CSILeaseErrorCode {
    csiLeaseOk = 0;
    csiLeaseNotFound = 1;
    csiLeaseConflict = 2;
    csiLeaseInvalidArgument = 3;
    csiLeaseInternalError = 4;
}

message AcquireCSILeaseRequest {
    string volume_id = 1;
    string node_id = 2;
    string host_nqn = 3;
    int64 ttl_seconds = 4;
}

message AcquireCSILeaseResponse {
    CSILeaseErrorCode errorcode = 1;
    CSIVolumeLease lease = 2;
}

message GetCSILeaseRequest {
    string volume_id = 1;
}

message GetCSILeaseResponse {
    CSILeaseErrorCode errorcode = 1;
    CSIVolumeLease lease = 2;
}

message RenewCSILeaseRequest {
    string volume_id = 1;
    string node_id = 2;
    string host_nqn = 3;
}

message RenewCSILeaseResponse {
    CSILeaseErrorCode errorcode = 1;
    CSIVolumeLease lease = 2;
}

message ReleaseCSILeaseRequest {
    string volume_id = 1;
    string node_id = 2;
    string host_nqn = 3;
}

message ReleaseCSILeaseResponse {
    CSILeaseErrorCode errorcode = 1;
}

message ListCSIVolumeMetadataRequest {
}

message ListCSIVolumeMetadataResponse {
    CSIMetadataErrorCode errorcode = 1;
    repeated CSIVolumeMetadata metadata = 2;
}

message ListCSIAttachmentRequest {
}

message ListCSIAttachmentResponse {
    CSIMetadataErrorCode errorcode = 1;
    repeated CSIAttachment attachments = 2;
}

message ListCSILeaseRequest {
}

message ListCSILeaseResponse {
    CSILeaseErrorCode errorcode = 1;
    repeated CSIVolumeLease leases = 2;
}

message ImageMetadataV2 {
    string image_id = 1;
    int32 pool_id = 2;
    string pool_name = 3;
    string image_name = 4;
    int64 size = 5;
    int64 object_size = 6;
    repeated string features = 7;
    string status = 8;
    string parent_snapshot_id = 9;
    uint32 depth = 10;
    int64 created_at_unix_nano = 11;
    int64 updated_at_unix_nano = 12;
    uint64 generation = 13;
}

message SnapshotMetadataV2 {
    string snapshot_id = 1;
    string snapshot_name = 2;
    string source_image_id = 3;
    int32 source_pool_id = 4;
    string source_pool_name = 5;
    string source_image_name = 6;
    uint64 snap_seq = 7;
    string status = 8;
    bool protected = 9;
    int64 created_at_unix_nano = 10;
    int64 updated_at_unix_nano = 11;
    string operation_id = 12;
    uint32 child_count = 13;
}

message ImageOperationRecordV2 {
    string operation_id = 1;
    string type = 2;
    string target_id = 3;
    string status = 4;
    string error = 5;
    int64 started_at_unix_nano = 6;
    int64 updated_at_unix_nano = 7;
}

enum ImageMetadataErrorCode {
    imageMetadataOk = 0;
    imageMetadataNotFound = 1;
    imageMetadataInvalidArgument = 2;
    imageMetadataInternalError = 3;
}

message PutImageMetadataRequest {
    ImageMetadataV2 metadata = 1;
}

message PutImageMetadataResponse {
    ImageMetadataErrorCode errorcode = 1;
}

message GetImageMetadataRequest {
    string image_id = 1;
}

message GetImageMetadataResponse {
    ImageMetadataErrorCode errorcode = 1;
    ImageMetadataV2 metadata = 2;
}

message DeleteImageMetadataRequest {
    string image_id = 1;
}

message DeleteImageMetadataResponse {
    ImageMetadataErrorCode errorcode = 1;
}

message ListImageMetadataRequest {
}

message ListImageMetadataResponse {
    ImageMetadataErrorCode errorcode = 1;
    repeated ImageMetadataV2 metadata = 2;
}

message PutSnapshotMetadataRequest {
    SnapshotMetadataV2 metadata = 1;
}

message PutSnapshotMetadataResponse {
    ImageMetadataErrorCode errorcode = 1;
}

message GetSnapshotMetadataRequest {
    string image_id = 1;
    string snapshot_id = 2;
}

message GetSnapshotMetadataResponse {
    ImageMetadataErrorCode errorcode = 1;
    SnapshotMetadataV2 metadata = 2;
}

message DeleteSnapshotMetadataRequest {
    string image_id = 1;
    string snapshot_id = 2;
}

message DeleteSnapshotMetadataResponse {
    ImageMetadataErrorCode errorcode = 1;
}

message ListSnapshotMetadataRequest {
    string image_id = 1;
}

message ListSnapshotMetadataResponse {
    ImageMetadataErrorCode errorcode = 1;
    repeated SnapshotMetadataV2 metadata = 2;
}

message PutImageChildLinkRequest {
    string snapshot_id = 1;
    string child_image_id = 2;
}

message PutImageChildLinkResponse {
    ImageMetadataErrorCode errorcode = 1;
}

message DeleteImageChildLinkRequest {
    string snapshot_id = 1;
    string child_image_id = 2;
}

message DeleteImageChildLinkResponse {
    ImageMetadataErrorCode errorcode = 1;
}

message ListImageChildLinkRequest {
    string snapshot_id = 1;
}

message ListImageChildLinkResponse {
    ImageMetadataErrorCode errorcode = 1;
    repeated string child_image_ids = 2;
}

message PutImageOperationRequest {
    ImageOperationRecordV2 record = 1;
}

message PutImageOperationResponse {
    ImageMetadataErrorCode errorcode = 1;
}

message GetImageOperationRequest {
    string operation_id = 1;
}

message GetImageOperationResponse {
    ImageMetadataErrorCode errorcode = 1;
    ImageOperationRecordV2 record = 2;
}

message DeleteImageOperationRequest {
    string operation_id = 1;
}

message DeleteImageOperationResponse {
    ImageMetadataErrorCode errorcode = 1;
}

message ListImageOperationRequest {
}

message ListImageOperationResponse {
    ImageMetadataErrorCode errorcode = 1;
    repeated ImageOperationRecordV2 records = 2;
}

message Request {
    oneof union {
        BootRequest boot_request = 1;
        OsdStopRequest osd_stop_request = 2;
        HeartbeatRequest heartbeat_request = 3;
        GetOsdMapRequest get_osdmap_request = 4;
        ListPoolsRequest list_pools_request = 5;
        ApplyIDRequest apply_id_request = 6;
        CreatePoolRequest create_pool_request = 7;
        GetPgMapRequest get_pgmap_request = 8;
        DeletePoolRequest delete_pool_request = 9;
        GetClusterMapRequest get_cluster_map_request = 10;
        CreateImageRequest create_image_request=11;
        RemoveImageRequest remove_image_request=12;
        ResizeImageRequest resize_image_request=13;
        GetImageInfoRequest get_ImageInfo_Request=14;
        LeaderBeElectedRequest leader_be_elected_request=15;
        PgMemberChangeFinishRequest pg_member_change_finish_request=16;
        OsdOutRequest  osd_out_request=17;
        OsdInRequest   osd_in_request=18;
        NoReblanceRequest  no_reblance_request=19;
        NoOutRequest   no_out_request=20;
        GetClusterStatusRequest get_cluster_status_request=21;
        DataStatisticsRequest   data_statistics_request=22;
        OsdConfigRequest osd_config_request=23;
        GetPgOsdInfoRequest  pg_osd_info_request=24;
        PutCSIVolumeMetadataRequest put_csi_volume_metadata_request = 25;
        GetCSIVolumeMetadataRequest get_csi_volume_metadata_request = 26;
        DeleteCSIVolumeMetadataRequest delete_csi_volume_metadata_request = 27;
        PutCSIAttachmentRequest put_csi_attachment_request = 28;
        GetCSIAttachmentRequest get_csi_attachment_request = 29;
        DeleteCSIAttachmentRequest delete_csi_attachment_request = 30;
        AcquireCSILeaseRequest acquire_csi_lease_request = 31;
        GetCSILeaseRequest get_csi_lease_request = 32;
        RenewCSILeaseRequest renew_csi_lease_request = 33;
        ReleaseCSILeaseRequest release_csi_lease_request = 34;
        ListCSIVolumeMetadataRequest list_csi_volume_metadata_request = 35;
        ListCSIAttachmentRequest list_csi_attachment_request = 36;
        ListCSILeaseRequest list_csi_lease_request = 37;
        PutImageMetadataRequest put_image_metadata_request = 38;
        GetImageMetadataRequest get_image_metadata_request = 39;
        DeleteImageMetadataRequest delete_image_metadata_request = 40;
        ListImageMetadataRequest list_image_metadata_request = 41;
        PutSnapshotMetadataRequest put_snapshot_metadata_request = 42;
        GetSnapshotMetadataRequest get_snapshot_metadata_request = 43;
        DeleteSnapshotMetadataRequest delete_snapshot_metadata_request = 44;
        ListSnapshotMetadataRequest list_snapshot_metadata_request = 45;
        PutImageChildLinkRequest put_image_child_link_request = 46;
        DeleteImageChildLinkRequest delete_image_child_link_request = 47;
        ListImageChildLinkRequest list_image_child_link_request = 48;
        PutImageOperationRequest put_image_operation_request = 49;
        GetImageOperationRequest get_image_operation_request = 50;
        DeleteImageOperationRequest delete_image_operation_request = 51;
        ListImageOperationRequest list_image_operation_request = 52;
    }
}

message Response {
    oneof union {
        BootResponse boot_response = 1;
        OsdStopResponse osd_stop_response = 2;
        HeartbeatResponse heartbeat_response = 3;
        GetOsdMapResponse get_osdmap_response = 4;
        ListPoolsResponse list_pools_response = 5;
        ApplyIDResponse apply_id_response = 6;
        CreatePoolResponse create_pool_response = 7;
        GetPgMapResponse get_pgmap_response = 8;
        DeletePoolResponse delete_pool_response = 9;
        GetClusterMapResponse get_cluster_map_response = 10;
        CreateImageResponse create_image_response=11;
        RemoveImageResponse remove_image_response=12;
        ResizeImageResponse resize_image_response=13;
        GetImageInfoResponse get_imageInfo_response=14;
        LeaderBeElectedResponse leader_be_elected_response=15;
        PgMemberChangeFinishResponse pg_member_change_finish_response=16;
        OsdOutResponse osd_out_response=17;
        OsdInResponse osd_in_response=18;
        NoReblanceResponse no_reblance_response=19;
        NoOutResponse  no_out_response=20;
        GetClusterStatusResponse  get_cluster_status_response=21;
        DataStatisticsResponse    data_statistics_response=22;
        OsdConfigResponse osd_config_response=23;
        GetPgOsdInfoResponse  pg_osd_info_response=24;
        PutCSIVolumeMetadataResponse put_csi_volume_metadata_response = 25;
        GetCSIVolumeMetadataResponse get_csi_volume_metadata_response = 26;
        DeleteCSIVolumeMetadataResponse delete_csi_volume_metadata_response = 27;
        PutCSIAttachmentResponse put_csi_attachment_response = 28;
        GetCSIAttachmentResponse get_csi_attachment_response = 29;
        DeleteCSIAttachmentResponse delete_csi_attachment_response = 30;
        AcquireCSILeaseResponse acquire_csi_lease_response = 31;
        GetCSILeaseResponse get_csi_lease_response = 32;
        RenewCSILeaseResponse renew_csi_lease_response = 33;
        ReleaseCSILeaseResponse release_csi_lease_response = 34;
        ListCSIVolumeMetadataResponse list_csi_volume_metadata_response = 35;
        ListCSIAttachmentResponse list_csi_attachment_response = 36;
        ListCSILeaseResponse list_csi_lease_response = 37;
        PutImageMetadataResponse put_image_metadata_response = 38;
        GetImageMetadataResponse get_image_metadata_response = 39;
        DeleteImageMetadataResponse delete_image_metadata_response = 40;
        ListImageMetadataResponse list_image_metadata_response = 41;
        PutSnapshotMetadataResponse put_snapshot_metadata_response = 42;
        GetSnapshotMetadataResponse get_snapshot_metadata_response = 43;
        DeleteSnapshotMetadataResponse delete_snapshot_metadata_response = 44;
        ListSnapshotMetadataResponse list_snapshot_metadata_response = 45;
        PutImageChildLinkResponse put_image_child_link_response = 46;
        DeleteImageChildLinkResponse delete_image_child_link_response = 47;
        ListImageChildLinkResponse list_image_child_link_response = 48;
        PutImageOperationResponse put_image_operation_response = 49;
        GetImageOperationResponse get_image_operation_response = 50;
        DeleteImageOperationResponse delete_image_operation_response = 51;
        ListImageOperationResponse list_image_operation_response = 52;
    }
}
